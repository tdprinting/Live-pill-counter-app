<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pill Counter">
<meta name="theme-color" content="#06090c">
<meta name="color-scheme" content="dark light">
<title>Pill Counter</title>
<style>
:root{
  --accent:#19d3c5; --accent-2:#5fe3d8; --accent-ink:#021a18;
  --alert:#ff4d5e; --amber:#ffb42e; --broken:#ff8f3d;
  --bg:#06090c;
  --glass:rgba(24,28,33,.62); --glass-strong:rgba(20,24,29,.86);
  --line:rgba(255,255,255,.14); --text:#f4f7f9; --muted:rgba(244,247,249,.62);
  --chip:rgba(255,255,255,.10); --track:rgba(255,255,255,.16);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --peek:92px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: light){
  :root{ --glass:rgba(255,255,255,.70); --glass-strong:rgba(250,251,252,.90);
    --line:rgba(0,0,0,.10); --text:#0b1114; --muted:rgba(11,17,20,.58);
    --chip:rgba(0,0,0,.06); --track:rgba(0,0,0,.12); --accent:#0aa89c; --accent-2:#0aa89c; --accent-ink:#fff; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 var(--font);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;background:#000}
#video,#still,#demo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#still.contain{object-fit:contain}
#app[data-src="video"] #video,#app[data-src="demo"] #demo{display:block}
#app.frozen #still{display:block}
#app.frozen #video,#app.frozen #demo{display:none}
#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none;pointer-events:none}
#app.frozen #overlay,#app.roi-edit #overlay{pointer-events:auto}
#scan{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s;overflow:hidden}
#scan::after{content:"";position:absolute;left:0;right:0;height:22%;top:-22%;
  background:linear-gradient(to bottom,transparent,rgba(25,211,197,.28),transparent);animation:scan 1.3s linear infinite}
#app.busy #scan{opacity:1}
@keyframes scan{to{top:100%}}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);
  border:.5px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.25)}

/* ---------- top stack ---------- */
#top{position:absolute;z-index:10;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);
  top:calc(var(--sat) + 8px);display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:560px}
#top>*{pointer-events:auto}
#bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:flex;padding:3px;border-radius:14px;position:relative}
.seg button{position:relative;z-index:1;min-height:38px;min-width:44px;padding:0 14px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:11px;background:var(--accent);transition:transform .3s cubic-bezier(.3,1.2,.4,1),width .3s}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;transition:transform .15s,background .2s}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

#hud{border-radius:22px;padding:12px 16px 14px;transition:box-shadow .3s,border-color .3s}
#hud.locked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 30px rgba(25,211,197,.25)}
.hud-row{display:flex;align-items:center;gap:14px}
.roll{font-size:76px;line-height:1;font-weight:700;letter-spacing:-.02em;display:flex;height:1em;overflow:hidden;font-variant-numeric:tabular-nums;min-width:.62em}
.dg{display:block;width:.6em;height:1em;overflow:hidden}
.strip{display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.9,.2,1)}
.strip span{display:block;height:1em;line-height:1;text-align:center}
#hud.locked .roll,#hud.pop .roll{animation:lockpulse .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes lockpulse{0%{transform:scale(1)}35%{transform:scale(1.1)}100%{transform:scale(1)}}
.hud-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.state i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.state.hold{color:var(--amber)} .state.hold i{background:var(--amber);animation:blink 1s infinite}
.state.lock{color:var(--accent)} .state.lock i{background:var(--accent)}
.state.cap i{background:var(--text)}
@keyframes blink{50%{opacity:.25}}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corr{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--chip);border-radius:10px;padding:4px 4px 4px 9px;align-self:flex-start}
.corr button{min-height:28px;padding:0 9px;border-radius:8px;background:var(--chip);color:var(--accent)}
.conf{margin-top:10px}
.conf-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin-bottom:5px}
.conf-top span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--track);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--c,var(--accent));transition:width .6s cubic-bezier(.2,.9,.2,1),background .4s}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(0,0,0,.28) calc(25% - 1px) 25%)}

.banner{display:flex;align-items:center;gap:10px;border-radius:16px;padding:9px 12px;min-height:44px;font-weight:600;
  animation:slidein .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slidein{from{opacity:0;transform:translateY(-10px) scale(.97)}}
.banner small{display:block;font-weight:500;font-size:12.5px;opacity:.85}
.banner .bi{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px}
.banner.odd{background:rgba(255,77,94,.88);color:#fff;border-color:rgba(255,255,255,.3)}
.banner.odd .bi{background:#fff;color:var(--alert)}
.banner.frag{background:rgba(255,160,40,.9);color:#2a1700}
.banner.frag .bi{background:#2a1700;color:var(--amber)}
.banner.info{background:var(--glass)}
.banner.info .bi{background:var(--accent);color:var(--accent-ink)}
.banner .grow{flex:1;min-width:0}
.banner button.mini{min-height:32px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.2);font-size:13px;color:inherit}
.tip{display:flex;align-items:center;gap:8px;border-radius:14px;padding:8px 12px;font-size:13.5px;animation:slidein .35s}
.tip .t-i{flex:none;font-size:16px}
.tip button{flex:none;min-height:32px;padding:0 10px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px}

/* ---------- shutter ---------- */
#shutterRow{position:absolute;z-index:11;left:0;right:0;bottom:calc(var(--peek) + var(--sab) + 14px);display:flex;justify-content:center;align-items:center;gap:14px;
  pointer-events:none;transition:opacity .25s,transform .3s}
#shutterRow>*{pointer-events:auto}
body.sheet-open #shutterRow{opacity:0;transform:translateY(30px);pointer-events:none}
body.sheet-open #shutterRow>*{pointer-events:none}
#shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;background:rgba(0,0,0,.18);transition:transform .15s}
#shutter::after{content:"";width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .15s,background .2s}
#shutter:active{transform:scale(.94)} #shutter:active::after{transform:scale(.88)}
#retake,#done{min-height:52px;padding:0 24px;border-radius:26px;font-weight:700;font-size:17px}
#retake{background:var(--accent);color:var(--accent-ink)}
.hint{position:absolute;z-index:11;left:50%;transform:translateX(-50%);bottom:calc(var(--peek) + var(--sab) + 100px);padding:7px 14px;border-radius:14px;font-size:13px;font-weight:500;white-space:nowrap;
  max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .3s}
body.sheet-open .hint{opacity:0}

/* ---------- bottom sheet ---------- */
#sheet{position:absolute;z-index:20;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;height:min(82vh,82dvh,760px);border-radius:26px 26px 0 0;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border:.5px solid var(--line);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.35);
  display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek) - var(--sab)));transition:transform .42s cubic-bezier(.2,.9,.2,1);will-change:transform}
#sheet.drag{transition:none}
#sheetHead{flex:none;height:calc(var(--peek) + var(--sab));padding:8px 16px var(--sab);touch-action:none;cursor:grab}
.grab{width:38px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 10px}
.peek{display:flex;align-items:center;gap:12px;height:52px}
.peek canvas{flex:none}
.peek .pt{flex:1;min-width:0}
.peek .pt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .pt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
body.sheet-open .chev{transform:rotate(180deg)}
#sheetBody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sab) + 28px);touch-action:pan-y;-webkit-user-select:text;user-select:text}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border-radius:15px;background:var(--chip);font-size:13px;font-weight:600}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.chip.link{color:var(--accent);min-height:44px;margin:-7px 0}
.notice{display:flex;gap:10px;padding:11px 13px;border-radius:14px;background:rgba(255,180,46,.14);border:.5px solid rgba(255,180,46,.45);font-size:13.5px;font-weight:500;margin-bottom:14px}
.notice b{color:var(--amber)}
.field{display:flex;align-items:center;gap:8px;height:48px;border-radius:14px;background:var(--chip);padding:0 14px;margin-bottom:6px}
.field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:17px;font-family:var(--mono);text-transform:uppercase;-webkit-user-select:text;user-select:text}
.field input::placeholder{text-transform:none;font-family:var(--font);color:var(--muted)}
.field svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.field button{width:44px;height:44px;margin-right:-10px;color:var(--muted);font-size:18px}
h3.sec{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--chip);margin-bottom:8px;position:relative;animation:slidein .3s both}
.card.best{background:linear-gradient(135deg,rgba(25,211,197,.20),rgba(25,211,197,.06));border:.5px solid rgba(25,211,197,.55)}
.card canvas{flex:none;margin-top:2px}
.card .ci{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:16px;line-height:1.2}
.card .nm small{font-weight:500;color:var(--muted);font-size:13px}
.card .im{font-family:var(--mono);font-size:13px;margin-top:2px;color:var(--accent)}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .why{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.score{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:700}
.score .bar{flex:1;height:6px}
.score .bar::after{display:none}
.lockbtn{margin-top:9px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.lockbtn.on{background:var(--chip);color:var(--text)}
.lockbtn.ghost{background:var(--chip);color:var(--accent)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* ---------- modal / fallback ---------- */
#modalWrap{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
#modal{width:100%;max-width:520px;max-height:84dvh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(var(--sab) + 20px);background:var(--glass-strong);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:.5px solid var(--line);animation:rise .4s cubic-bezier(.2,.9,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
#modal h2{margin:0 0 4px;font-size:22px}
#modal p{margin:0 0 14px;color:var(--muted);font-size:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 14px;border-radius:14px;background:var(--chip);margin-bottom:8px;text-align:left;font-weight:600}
.opt small{margin-left:auto;color:var(--muted);font-weight:500}
.opt.sel{outline:2px solid var(--accent)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:48px;border-radius:14px;font-weight:700;font-size:16px;background:var(--chip);display:grid;place-items:center;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line)}
.hist b{font-size:28px;min-width:54px;font-variant-numeric:tabular-nums}
.hist span{color:var(--muted);font-size:13px}
.hist .r{margin-left:auto;text-align:right}

#fallback{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0,#10303a 0,#06090c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--sat) + 24px) 28px calc(var(--sab) + 24px);gap:14px;color:#f4f7f9}
#fallback h1{margin:6px 0 0;font-size:26px}
#fallback p{margin:0;max-width:340px;color:rgba(244,247,249,.7)}
#fallback .big{min-height:56px;min-width:240px;padding:0 28px;border-radius:28px;background:var(--accent);color:#021a18;font-weight:700;font-size:18px;display:grid;place-items:center;margin-top:8px;cursor:pointer}
#fallback .sec2{min-height:44px;color:var(--accent-2);font-weight:600;display:grid;place-items:center;padding:0 16px;cursor:pointer}
#fallback .why{font-size:12px;font-family:var(--mono);opacity:.5}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.pillart{width:92px;height:92px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}

#toast{position:absolute;z-index:45;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-80px);padding:11px 16px;border-radius:16px;font-weight:600;font-size:14px;max-width:90vw;text-align:center;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}
#toast.show{transform:translate(-50%,0)}
#guide{position:absolute;z-index:12;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 74px);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-weight:600;max-width:92vw}
#guide button{min-height:36px;padding:0 14px;border-radius:11px;background:var(--chip);color:var(--accent)}

@media (orientation:landscape) and (max-height:520px){
  #top{max-width:340px}
  .roll{font-size:56px}
  #sheet{left:auto;right:calc(var(--sar) + 8px);width:min(400px,46vw);max-width:none;height:calc(100dvh - 20px);border-radius:26px 26px 0 0}
  #shutterRow{left:auto;right:calc(var(--sar) + 24px);bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column;justify-content:center;width:auto}
  body.sheet-open #shutterRow{transform:translateY(-50%)}
  .hint{bottom:calc(var(--sab) + 16px);left:calc(var(--sal) + 12px);transform:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  #scan::after{animation:none;top:0;height:100%;background:rgba(25,211,197,.10)}
}

/* ---------- extras: target, tally, groups, settings, record ---------- */
@supports (font:-apple-system-body){ html,body{font:-apple-system-body;line-height:1.35} }
:root{--peek:max(92px,5.8rem)}
.roll{font-size:max(76px,4.5rem)}
.state{font-size:.95rem}.sub{font-size:.82rem}.conf-top{font-size:.82rem}.corr{font-size:.76rem}
.banner{font-size:.95rem}.banner small{font-size:.8rem}.tip{font-size:.85rem}.hint{font-size:.82rem}
.peek .pt b{font-size:1rem}.peek .pt span{font-size:.82rem}.chip{font-size:.82rem}.opt{font-size:1rem}.btn{font-size:1rem}
.hist span{font-size:.82rem}.hist .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
.ringwrap{position:relative;width:3.6rem;height:3.6rem;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:5;stroke-linecap:round}
.ringwrap .trk{stroke:var(--track)}
.ringwrap .prg{stroke:var(--rc,var(--accent));stroke-dasharray:138.2;stroke-dashoffset:138.2;transition:stroke-dashoffset .6s cubic-bezier(.2,.9,.2,1),stroke .3s}
.ringwrap .rt{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.goal{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal.add{color:var(--amber)}.goal.rem{color:var(--alert)}.goal.ok{color:var(--accent)}
.verify{display:inline-flex;align-self:flex-start;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:10px}
.verify.ok{background:rgba(25,211,197,.2);color:var(--accent)}.verify.diff{background:rgba(255,180,46,.22);color:var(--amber)}
#hud.hit{animation:hit .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(25,211,197,.7)}40%{transform:scale(1.03);box-shadow:0 0 0 14px rgba(25,211,197,0),0 8px 40px rgba(25,211,197,.55)}100%{transform:scale(1)}}
#hud.hit .ringwrap{animation:ringpop .7s cubic-bezier(.2,.9,.3,1.6)}
@keyframes ringpop{40%{transform:scale(1.35) rotate(8deg)}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent);animation:fly .85s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;font-weight:700;font-size:.9rem;max-width:100%;white-space:nowrap}
.pchip b{color:var(--accent)}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pchip.tally{min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;line-height:44px;flex:0 1 auto}
.pchip.sq{padding:0;width:44px;justify-content:center}
#shutter{position:relative}
#autoRing{position:absolute;left:-8px;top:-8px;width:84px;height:84px;transform:rotate(-90deg);pointer-events:none;display:none}
#autoRing circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3}
.sbtn{min-height:52px;padding:0 16px;border-radius:26px;font-weight:700;font-size:1rem}
.padv{font-size:3rem;font-weight:700;text-align:center;min-height:1.2em;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.presets button{flex:1 0 20%;min-height:48px;border-radius:14px;background:var(--chip);font-weight:700;font-size:1.05rem}
.presets button.on{background:var(--accent);color:var(--accent-ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:58px;border-radius:16px;background:var(--chip);font-size:1.5rem;font-weight:600}
.pad button:active{background:var(--accent);color:var(--accent-ink)}
.sw2{margin-left:auto;width:50px;height:30px;border-radius:15px;background:var(--track);position:relative;flex:none;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.opt[aria-checked="true"] .sw2{background:var(--accent)}.opt[aria-checked="true"] .sw2::after{transform:translateX(20px)}
.opt .lbl{display:block}.opt .lbl small{display:block;margin:0;font-size:.78rem}
.recimg{width:100%;max-height:52dvh;object-fit:contain;background:#000;border-radius:14px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;margin-bottom:10px}
a.btn{text-decoration:none;color:inherit}
.batch{display:flex;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--line);font-variant-numeric:tabular-nums}

/* ---------- identify mode ---------- */
#appSeg{width:100%;max-width:340px;align-self:flex-start}
#appSeg .thumb{display:none}
#appSeg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#appSeg button{flex:1}
#app.idm :is(#hud,#chips,#banners,#tips,#shutterRow,#sheet,#hint,#guide,#modeSeg,#btnArea){display:none!important}
#idv{position:absolute;inset:0;z-index:8;pointer-events:none}
#idv>*{pointer-events:auto}
#idPrompt{position:absolute;left:50%;transform:translateX(-50%);width:max-content;padding:8px 16px;border-radius:16px;font-weight:600;font-size:.95rem;max-width:92vw;text-align:center;pointer-events:none}
#idPanel{position:absolute;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 14px);margin:0 auto;max-width:560px;border-radius:22px;padding:12px 14px;transition:border-color .3s,box-shadow .3s}
#idPanel.got{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 30px rgba(25,211,197,.28);animation:lockpulse .6s cubic-bezier(.2,.9,.3,1.4)}
.idrow{display:flex;align-items:center;gap:12px}
.idicon{flex:none;animation:float 3s ease-in-out infinite}
.idtraits{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.idtraits .chip{animation:slidein .35s both}
.idstate{display:flex;align-items:center;gap:10px;margin-top:8px;font-weight:700;font-size:.95rem}
.idstate span{flex:none;min-width:8.5em}
.idstate .bar{flex:1;height:8px}
.idstate .bar::after{display:none}
.idstate.ok span{color:var(--accent)}.idstate.hold span{color:var(--amber)}
#idPicks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#idPicks:empty{display:none}
#idPicks .pchip{min-height:44px;padding:0 12px 0 8px}
#idRes{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--glass-strong);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);animation:fade .25s;
  padding:calc(var(--sat) + 124px) calc(var(--sar) + 14px) calc(var(--sab) + 40px) calc(var(--sal) + 14px);-webkit-user-select:text;user-select:text;touch-action:pan-y}
#idRes .wrap{max-width:560px;margin:0 auto}
#idZoom{width:100%;height:min(44vh,340px);border-radius:18px;background:#000;touch-action:none;display:block;-webkit-user-select:none;user-select:none}
.idtools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.idtools .pchip,.idsides .pchip{background:var(--chip)}
.idtools .pchip[aria-pressed="true"],.idsides .pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.idcap{font-size:.78rem;color:var(--muted);margin:2px 0 0}
.idsides{display:flex;gap:6px;margin-bottom:8px}
.idlbl{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.idinp{width:100%;height:60px;border-radius:16px;background:var(--chip);border:1.5px solid transparent;font:600 28px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:0 16px;outline:0;-webkit-user-select:text;user-select:text}
.idinp:focus{border-color:var(--accent)}
.idinp::placeholder{font:500 16px var(--font);text-transform:none;letter-spacing:0;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.keys button{min-width:44px;min-height:44px;padding:0 10px;border-radius:12px;background:var(--chip);font:700 17px var(--mono)}
.keys button:active{background:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:9px;background:var(--chip);color:var(--muted);margin:5px 4px 0 0}
.card .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .btns .lockbtn,.card .btns a{margin-top:0;display:inline-grid;place-items:center;text-decoration:none}
.card.chosen{outline:2px solid var(--accent)}
details.sim{margin-top:6px}
details.sim summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;font-size:.9rem;cursor:pointer;list-style:none}
details.sim summary::-webkit-details-marker{display:none}
details.sim summary::before{content:"\25B8";margin-right:6px;transition:transform .2s}
details.sim[open] summary::before{transform:rotate(90deg)}
.simrow{padding:6px 0;border-top:.5px solid var(--line);font-size:.85rem}
.simrow b{display:block}.simrow span{color:var(--muted);font-size:.78rem}
.idfine{font-size:.78rem;color:var(--muted);margin:14px 0 4px;text-align:center}
.hist .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
</style>

<script>window.__PILL_WORKER_SRC__ = "// ===== pillcv.js =====\n// PillCV \u2014 pill detection, counting and odd-pill detection.\n// Pure JS, no dependencies. Runs in a Web Worker on the phone and in Node for tests.\n//\n// Pipeline\n//  1. RGB -> CIELAB.\n//  2. Model the tray/plate as a smooth colour surface (quadratic fit), so uneven\n//     lighting, vignetting and colour casts do not look like pills.\n//  3. Foreground = colour distance from that surface (with soft-shadow suppression)\n//     OR a sharp edge (catches white pills on white plates). Hysteresis + hole fill.\n//  4. Connected blobs. Learn the single-pill size from clean, convex blobs.\n//  5. Split touching / overlapping blobs: distance-transform cores give one seed\n//     per visible pill; area / single-pill area estimates pills hidden by overlap.\n//  6. Describe every pill (illumination-normalised colour, two-tone, size, aspect)\n//     and group them by type. The biggest group is \"primary\"; the rest are flagged.\n\nconst SRGB_LIN = new Float32Array(256);\nfor (let i = 0; i < 256; i++) {\n  const c = i / 255;\n  SRGB_LIN[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);\n}\n\nfunction fLab(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }\n\nfunction linToLab(r, g, b) {\n  const X = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047;\n  const Y = 0.2126 * r + 0.7152 * g + 0.0722 * b;\n  const Z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;\n  const fx = fLab(X), fy = fLab(Y), fz = fLab(Z);\n  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];\n}\n\nfunction labToRgb(L, a, b) {\n  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;\n  const inv = (t) => (t > 0.206893 ? t * t * t : (t - 16 / 116) / 7.787);\n  const X = inv(fx) * 0.95047, Y = inv(fy), Z = inv(fz) * 1.08883;\n  const lin = [\n    3.2406 * X - 1.5372 * Y - 0.4986 * Z,\n    -0.9689 * X + 1.8758 * Y + 0.0415 * Z,\n    0.0557 * X - 0.204 * Y + 1.057 * Z,\n  ];\n  return lin.ma   for (let i = 0; i < w * h; i++) if (Math.hypot(A[i] - A0, B[i] - B0) < 9 && L[i] > L0 * 0.55 && L[i] < L0 * 1.35 + 6) m[i] = 1;
  const { comps } = components(erode(m, w, h, 2), w, h, 50);
  if (!comps.length) return null;
  comps.sort((a, b) => b.px.length - a.px.length);
  const top = comps[0];
  if (top.px.length < 0.08 * w * h) return null;
  // the tray = convex hull of that surface (pills on it are inside the hull)
  const st = shapeStats(top.px, w);
  if (st.hullArea > 0.97 * w * h) return null; // surface fills the frame: nothing to crop
  const mask = new Uint8Array(w * h);
  fillPolygon(mask, w, h, st.hull);
  const [x0, y0, x1, y1] = st.bbox;
  return { mask, x: x0 / w, y: y0 / h, w: (x1 - x0 + 1) / w, h: (y1 - y0 + 1) / h, poly: st.hull.map(([x, y]) => [x / w, y / h]) };
}

// ---------- LiDAR height map ----------
// depth: { data: Float32Array metres (dw x dh), w, h, conf?: Uint8Array, fx, fy, cx, cy } with
// intrinsics in the analysed image's pixel units. bgIdx: image pixels known to be tray.
function heightMap(depth, w, h, bgIdx) {
  const { data, w: dw, h: dh, conf } = depth;
  const sx = dw / w, sy = dh / h;
  const zAt = (x, y) => { // bilinear, mm
    const fx = Math.min(dw - 1.001, Math.max(0, (x + 0.5) * sx - 0.5)), fy = Math.min(dh - 1.001, Math.max(0, (y + 0.5) * sy - 0.5));
    const x0 = fx | 0, y0 = fy | 0, ax = fx - x0, ay = fy - y0, k = y0 * dw + x0;
    return 1000 * ((data[k] * (1 - ax) + data[k + 1] * ax) * (1 - ay) + (data[k + dw] * (1 - ax) + data[k + dw + 1] * ax) * ay);
  };
  // robust plane z = a + b*u + c*v through tray samples (iteratively drop outliers)
  let pts = [];
  for (const i of bgIdx) { const x = i % w, y = (i / w) | 0; const ci = Math.min(dh - 1, (y * sy) | 0) * dw + Math.min(dw - 1, (x * sx) | 0); if (!conf || conf[ci] >= 1) pts.push([x / w - 0.5, y / h - 0.5, zAt(x, y)]); }
  if (pts.length < 30) return null;
  let a = median(pts.map((q) => q[2])), b = 0, c = 0, sig = 3;
  for (let it = 0; it < 4; it++) {
    const keep = pts.filter((q) => Math.abs(q[2] - (a + b * q[0] + c * q[1])) < Math.max(1.2, 3 * sig));
    let Suu = 0, Svv = 0, Suv = 0, Su = 0, Sv = 0, Sz = 0, Suz = 0, Svz = 0; const n = keep.length;
    for (const [u, v, z] of keep) { Su += u; Sv += v; Sz += z; Suu += u * u; Svv += v * v; Suv += u * v; Suz += u * z; Svz += v * z; }
    const sol = solve([[n, Su, Sv], [Su, Suu, Suv], [Sv, Suv, Svv]], [Sz, Suz, Svz], 3);
    [a, b, c] = sol;
    const res = keep.map((q) => q[2] - (a + b * q[0] + c * q[1]));
    sig = Math.max(0.2, 1.4826 * median(res.map(Math.abs)));
  }
  const Hm = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) Hm[y * w + x] = a + b * (x / w - 0.5) + c * (y / h - 0.5) - zAt(x, y);
  return { Hm, mmPerPx: a / depth.fx, noiseMm: sig, trayMm: a, hT: Math.max(1.2, 3.5 * sig) };
}

function localDT(px, w) {
  // exact EDT restricted to a pixel set, computed on its bounding box
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (const i of px) { const x = i % w, y = (i / w) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const bw = x1 - x0 + 3, bh = y1 - y0 + 3, m = new Uint8Array(bw * bh);
  for (const i of px) m[((i / w | 0) - y0 + 1) * bw + (i % w) - x0 + 1] = 1;
  const d = distanceTransform(m, bw, bh), out = new Map();
  for (const i of px) out.set(i, d[((i / w | 0) - y0 + 1) * bw + (i % w) - x0 + 1]);
  return out;
}

function coreComponents(sub, w, minSize) {
  const set = new Set(sub), seen = new Set(), out = [];
  for (const s of sub) {
    if (seen.has(s)) continue;
    const q = [s]; seen.add(s); const px = [];
    while (q.length) {
      const i = q.pop(); px.push(i);
      for (const j of [i - 1, i + 1, i - w, i + w]) if (set.has(j) && !seen.has(j)) { seen.add(j); q.push(j); }
    }
    if (px.length >= minSize) out.push(px);
  }
  out.sort((a, b) => b.length - a.length);
  return out;
}

// Split a blob into n pills: geodesic growth from seed cores, k-means for extra (hidden) pills.
function partition(c, n, seeds, w) {
  const px = c.px;
  const centers = [];
  if (seeds) for (const s of seeds) {
    let sx = 0, sy = 0; for (const i of s) { sx += i % w; sy += (i / w) | 0; }
    centers.push([sx / s.length, sy / s.length]);
  }
  const pts = px.map((i) => [i % w, (i / w) | 0]);
  while (centers.length < n) { // farthest-point seeding for pills not visible as separate cores
    let bi = 0, bd = -1;
    for (let k = 0; k < pts.length; k += 3) {
      let d = Infinity; for (const c2 of centers) d = Math.min(d, (pts[k][0] - c2[0]) ** 2 + (pts[k][1] - c2[1]) ** 2);
      if (!centers.length) d = (pts[k][0] - c.cx) ** 2 + (pts[k][1] - c.cy) ** 2;
      if (d > bd) { bd = d; bi = k; }
    }
    centers.push([...pts[bi]]);
  }
  const fixed = seeds ? seeds.length : 0;
  const assign = new Int32Array(pts.length);
  for (let it = 0; it < 10; it++) {
    for (let k = 0; k < pts.length; k++) {
      let bd = Infinity, bj = 0;
      for (let j = 0; j < n; j++) { const d = (pts[k][0] - centers[j][0]) ** 2 + (pts[k][1] - centers[j][1]) ** 2; if (d < bd) { bd = d; bj = j; } }
      assign[k] = bj;
    }
    if (fixed === n && it > 0) break;
    const acc = Array.from({ length: n }, () => [0, 0, 0]);
    for (let k = 0; k < pts.length; k++) { const a = acc[assign[k]]; a[0] += pts[k][0]; a[1] += pts[k][1]; a[2]++; }
    for (let j = fixed; j < n; j++) if (acc[j][2]) centers[j] = [acc[j][0] / acc[j][2], acc[j][1] / acc[j][2]];
  }
  if (seeds && fixed === n) {
    // geodesic growth from the cores gives cleaner cuts than straight Voronoi lines
    const lab = new Map();
    let frontier = [];
    seeds.forEach((s, j) => s.forEach((i) => { lab.set(i, j); frontier.push(i); }));
    const inBlob = new Set(px);
    while (frontier.length) {
      const nxt = [];
      for (const i of frontier) for (const j of [i - 1, i + 1, i - w, i + w]) if (inBlob.has(j) && !lab.has(j)) { lab.set(j, lab.get(i)); nxt.push(j); }
      frontier = nxt;
    }
    const parts = Array.from({ length: n }, () => []);
    for (const i of px) parts[lab.has(i) ? lab.get(i) : 0].push(i);
    return parts.filter((p) => p.length);
  }
  const parts = Array.from({ length: n }, () => []);
  for (let k = 0; k < pts.length; k++) parts[assign[k]].push(px[k]);
  return parts.filter((p) => p.length);
}

function deltaE(p, q) { return Math.hypot(0.7 * (p[0] - q[0]), p[1] - q[1], p[2] - q[2]); }

function pillDist(p, g) {
  // normalised distance of a pill to a group's typical pill; > 1 means "different"
  const dc = deltaE(p.lab, g.lab) / g.tolC;
  let ds = 0, da = 0, dt = 0;
  if (p.area && g.area) ds = Math.abs(Math.log(p.area / g.area)) / g.tolS;
  if (p.aspect && g.aspect) da = Math.abs(p.aspect - g.aspect) / g.tolA;
  // two-tone contrast varies with the capsule's angle to the light: compare the class only
  if (!p.inCluster && g.twoTone != null && (p.twoTone > 14) !== (g.twoTone > 14) && Math.abs(p.twoTone - g.twoTone) > 10) dt = 1.5;
  return Math.max(dc, ds, da, dt);
}

function groupPills(pills, unit) {
  // 1) group the clean singles; 2) pills cut out of clumps (whose colour picks up some of
  //    their neighbours) join the nearest existing group unless clearly different.
  const singles = pills.filter((p) => !p.inCluster), clumped = pills.filter((p) => p.inCluster);
  const groups = singles.length ? groupSet(singles, unit) : [];
  const rest = [];
  for (const p of clumped) {
    let bg = null, bd = Infinity;
    for (const g of groups) {
      const d = Math.min(deltaE(p.lab, g.lab), deltaE(p.lab, g.halves[0]), deltaE(p.lab, g.halves[1])) / g.tolC;
      if (d < bd) { bd = d; bg = g; }
    }
    if (bg && bd <= 1.8) { bg.pills.push(p); bg.count++; } else rest.push(p);
  }
  if (rest.length) groups.push(...groupSet(rest, unit));
  return groups;
}

function groupSet(pills, unit) {
  const left = new Set(pills.map((_, i) => i));
  const groups = [];
  while (left.size) {
    // seed from the clean singles still unassigned (or anything if none)
    let ids = [...left].filter((i) => !pills[i].inCluster);
    if (!ids.length) ids = [...left];
    let g = describe(ids.map((i) => pills[i]), unit);
    // choose the medoid as seed so a mixed set does not average into nonsense
    let best = ids[0], bestS = Infinity;
    for (const i of ids) {
      let s = 0; for (const j of ids) s += Math.min(3, pillDist(pills[j], { ...g, lab: pills[i].lab, area: pills[i].area || g.area, aspect: pills[i].aspect || g.aspect, twoTone: pills[i].twoTone }));
      if (s < bestS) { bestS = s; best = i; }
    }
    const seed = pills[best];
    g = { ...g, lab: seed.lab, area: seed.area || g.area, aspect: seed.aspect || g.aspect, twoTone: seed.twoTone };
    let members = [];
    for (let it = 0; it < 3; it++) {
      members = [...left].filter((i) => pillDist(pills[i], g) <= 1);
      if (!members.length) { members = [best]; break; }
      const ng = describe(members.map((i) => pills[i]), unit);
      g = ng;
    }
    if (!members.includes(best)) members.push(best);
    for (const i of members) left.delete(i);
    groups.push({ ...g, pills: members.map((i) => pills[i]), count: members.length });
  }
  return groups;
}

function describe(list, unit) {
  const singles = list.filter((p) => !p.inCluster);
  const src = singles.length ? singles : list;
  const lab = [0, 1, 2].map((k) => median(src.map((p) => p.lab[k])));
  const dEs = src.map((p) => deltaE(p.lab, lab));
  const area = singles.length ? median(singles.map((p) => p.area)) : unit;
  const aspect = singles.length ? median(singles.map((p) => p.aspect)) : null;
  const twoTone = singles.length ? median(singles.map((p) => p.twoTone)) : null;
  const logs = singles.map((p) => Math.log(p.area / area));
  const halves = singles.length ? [0, 1].map((hh) => [0, 1, 2].map((k) => median(singles.map((p) => orientHalves(p, singles[0])[hh][k])))) : [lab, lab];
  return {
    lab, area, aspect, twoTone, halves,
    tolC: Math.max(8, 3.5 * median(dEs) * 1.4826),
    // size/shape alone must differ clearly (>~30% area, >~0.3 aspect) before a pill is called different
    tolS: Math.max(0.27, 3.5 * mad(logs, median(logs))),
    tolA: Math.max(0.3, aspect ? 0.17 * aspect : 0.3),
    tolT: Math.max(9, 3 * mad(singles.map((p) => p.twoTone), twoTone || 0)),
  };
}
function orientHalves(p, ref) {
  // order halves so the lighter half is first; makes two-tone capsules comparable
  const [h1, h2] = p.halves; void ref;
  return h1[0] >= h2[0] ? [h1, h2] : [h2, h1];
}

function summarizeGroup(g, mmPerPx) {
  const twoTone = g.twoTone != null && g.twoTone > 12;
  const colors = twoTone ? [colorName(...g.halves[0]), colorName(...g.halves[1])] : [colorName(...g.lab)];
  const shapes = g.pills.map((p) => p.shape).filter(Boolean);
  const counts = {}; shapes.forEach((s) => (counts[s] = (counts[s] || 0) + 1));
  let shape = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
  if (twoTone) shape = "capsule";
  const lengthPx = g.aspect && g.area ? 2 * Math.sqrt((g.area * g.aspect) / Math.PI) : null;
  return {
    count: g.count, role: g.role, lab: g.lab, rgb: labToRgb(...g.lab),
    halvesRgb: twoTone ? g.halves.map((hh) => labToRgb(...hh)) : null,
    colors, twoTone, shape, aspect: g.aspect, areaPx: g.area, lengthPx,
    lengthMm: mmPerPx && lengthPx ? lengthPx * mmPerPx : null,
  };
}


// ===== pill-id.js =====
// Pill identification: ranks FDA label appearances against a detected group, plus fuzzy imprint search.



// ---------- imprint normalisation ----------
const CONFUSE = { O: "0", Q: "0", D: "0", I: "1", L: "1", S: "5", B: "8", G: "6", Z: "2" };
const norm = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const canon = (s) => norm(s).replace(/[OQDILSBGZ]/g, (c) => CONFUSE[c]);

function lev1(a, b) { // true if edit distance <= 1
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (la === lb) { i++; j++; } else if (la > lb) i++; else j++;
  }
  return edits + (la - i) + (lb - j) <= 1;
}

function permutations(arr) {
  if (arr.length <= 1) return [arr];
  if (arr.length > 4) return [arr];
  const out = [];
  arr.forEach((x, i) => permutations([...arr.slice(0, i), ...arr.slice(i + 1)]).forEach((p) => out.push([x, ...p])));
  return out;
}

// ---------- database prep (dedupe) ----------
const ENTRIES = [];
(function build() {
  const map = new Map();
  const labelerSets = new Map();
  for (const r of PILL_DB) {
    if (!labelerSets.has(r.query)) labelerSets.set(r.query, new Set());
    labelerSets.get(r.query).add(r.labeler);
    const sides = String(r.imprint || "").split(";").map((s) => s.trim()).filter(Boolean);
    const colors = [...(r.color || [])].map((c) => c.toLowerCase());
    const key = [[...r.ingredients].map((x) => x.toLowerCase()).sort().join("+"), r.strength, sides.map(norm).sort().join("|"),
      [...colors].sort().join("+"), r.shape].join("#");
    let e = map.get(key);
    if (!e) {
      const cs = sides.map(canon).filter(Boolean);
      e = {
        name: r.name, ingredients: r.ingredients, strength: r.strength, colors, shape: String(r.shape || "").toLowerCase(),
        sizeMm: r.sizeMm || null, query: r.query, imprintText: sides.join(" · "),
        perms: permutations(cs).map((p) => p.join("")), rawPerms: permutations(sides.map(norm).filter(Boolean)).map((p) => p.join("")), sides: cs, rawAll: sides.map(norm).join(""),
        labelers: [],
      };
      map.set(key, e); ENTRIES.push(e);
    }
    if (r.labeler && !e.labelers.includes(r.labeler)) e.labelers.push(r.labeler);
  }
  let max = 1;
  for (const s of labelerSets.values()) max = Math.max(max, s.size);
  for (const e of ENTRIES) e.prior = Math.log(1 + labelerSets.get(e.query).size) / Math.log(1 + max);
})();

// ---------- imprint matching: m in 0..1 ----------
function imprintMatch(text, e) {
  const q = norm(text);
  if (!q || !e.sides.length) return { m: 0, how: "" };
  const qc = canon(text);
  const tokens = String(text).toUpperCase().split(/[\s;,/·]+/).map(canon).filter(Boolean);
  if (e.rawPerms.includes(q)) return { m: 1, how: "imprint matches" };
  if (e.perms.includes(qc)) return { m: 0.9, how: "imprint matches (OCR-tolerant)" };
  if (e.sides.includes(qc)) return { m: 0.8, how: "imprint matches one side" };
  if (tokens.length > 1 && tokens.every((t) => e.sides.includes(t))) return { m: 0.92, how: "imprint matches" };
  if (tokens.length > 1 && tokens.every((t) => e.perms.some((p) => p.includes(t)))) return { m: 0.75, how: "imprint partly matches" };
  if (qc.length >= 3 && e.perms.some((p) => p.includes(qc))) return { m: 0.65, how: "imprint contained" };
  if (qc.length >= 4 && (e.perms.some((p) => lev1(p, qc)) || e.sides.some((s) => s.length >= 4 && lev1(s, qc)))) return { m: 0.55, how: "imprint similar" };
  if (qc.length >= 4 && e.perms.some((p) => p.length > qc.length && [...Array(p.length - qc.length + 1).keys()].some((i) => lev1(p.slice(i, i + qc.length), qc)))) return { m: 0.4, how: "imprint similar" };
  return { m: 0, how: "" };
}

// ---------- appearance ----------
const EXP_ASPECT = { round: 1, square: 1, diamond: 1.05, "double circle": 1, triangle: 1.1, oval: 1.5, capsule: 2.2, rectangle: 1.9, tear: 1.4, bullet: 1.8, "semi-circle": 1.6 };
function aspectExpect(shape) {
  if (EXP_ASPECT[shape] != null) return EXP_ASPECT[shape];
  if (/hexagon|pentagon|octagon/.test(shape)) return 1;
  return null;
}

function detShape(g) {
  if (g.shape) return g.shape;
  if (g.aspect) return g.aspect > 1.85 ? "capsule" : g.aspect > 1.13 ? "oval" : "round";
  return null;
}

function shapeSim(det, row) {
  if (!det) return 0.75;
  const t = {
    capsule: { capsule: 1, bullet: 0.6, oval: 0.5, rectangle: 0.45, tear: 0.3 },
    oval: { oval: 1, capsule: 0.5, tear: 0.5, egg: 0.5, rectangle: 0.3, bullet: 0.4, "semi-circle": 0.2, round: 0.15 },
    round: { round: 1, "double circle": 0.5, oval: 0.15 },
    "four-sided": { square: 1, diamond: 1, rectangle: 0.9, "four-sided": 1, trapezoid: 0.8, round: 0.2, oval: 0.1 },
    triangle: { triangle: 1, "semi-circle": 0.3, trapezoid: 0.2 },
  }[det] || {};
  if (t[row] != null) return t[row];
  if (det === "round" && /hexagon|pentagon|octagon/.test(row)) return 0.4;
  if (det === "four-sided" && /pentagon|hexagon/.test(row)) return 0.2;
  return 0.07;
}

function colorSim(g, rowColors) {
  const seen = (g.colors && g.colors.length ? g.colors : []).map((c) => c.toLowerCase());
  if (!seen.length) return 0.7;
  if (seen.length === 1) {
    if (rowColors.length === 1) return colorSimilarity(seen[0], rowColors[0]);
    return 0.12 * Math.max(...rowColors.map((c) => colorSimilarity(seen[0], c))) + 0.02; // one seen vs two-colour product
  }
  if (rowColors.length < 2) return 0.1 * Math.max(...seen.map((c) => colorSimilarity(c, rowColors[0]))) + 0.02;
  const a = colorSimilarity(seen[0], rowColors[0]) * colorSimilarity(seen[1], rowColors[1]);
  const b = colorSimilarity(seen[0], rowColors[1]) * colorSimilarity(seen[1], rowColors[0]);
  return Math.sqrt(Math.max(a, b));
}

function groupLengthMm(g, mmPerPx) {
  if (g.lengthMm) return g.lengthMm;
  const mp = mmPerPx || g.mmPerPx;
  if (g.lengthPx && mp) return g.lengthPx * mp;
  return null;
}

function appearance(g, e, lenMm) {
  const reasons = [];
  const cs = colorSim(g, e.colors);
  const ds = detShape(g);
  let sh = shapeSim(ds, e.shape);
  if (g.aspect && ds) {
    const ex = aspectExpect(e.shape);
    if (ex) {
      const d = Math.log(g.aspect / ex);
      sh *= 0.65 + 0.35 * Math.exp(-(d * d) / (2 * 0.28 * 0.28));
    }
  }
  let sz = 1;
  let sizeReason = null;
  if (lenMm && e.sizeMm) {
    const d = Math.abs(lenMm - e.sizeMm);
    sz = 0.1 + 0.9 * Math.exp(-(d * d) / (2 * 1.2 * 1.2));
    sizeReason = d <= 2 ? `size ${e.sizeMm} mm ≈ ${lenMm.toFixed(1)} mm` : `size ${e.sizeMm} mm vs ${lenMm.toFixed(1)} mm`;
  }
  if (cs >= 0.9) reasons.push("colour match"); else if (cs >= 0.3) reasons.push("similar colour");
  if (sh >= 0.9) reasons.push("shape match"); else if (sh >= 0.4) reasons.push("similar shape");
  if (sizeReason) reasons.push(sizeReason);
  return { app: cs * Math.pow(sh, 0.8) * sz, reasons };
}

function toResult(e, score, reasons) {
  return {
    name: e.name, generic: e.ingredients.join(" / "), strength: e.strength, imprint: e.imprintText,
    colors: e.colors.slice(), shape: e.shape, sizeMm: e.sizeMm, labeler: e.labelers.slice(0, 3).join(", "),
    score: Math.max(0, Math.min(1, Math.round(score * 1000) / 1000)), reasons,
  };
}

// keep variety: at most 2 per generic+colour in the first pass
function diversify(items, limit) {
  const out = [], rest = [], seen = new Map();
  for (const it of items) {
    if (out.length >= limit) break;
    const k = it.e.ingredients.join("+") + "#" + it.e.colors.join("+");
    const n = seen.get(k) || 0;
    if (n < 2) { out.push(it); seen.set(k, n + 1); } else rest.push(it);
  }
  for (const it of rest) { if (out.length >= limit) break; out.push(it); }
  return out.sort((a, b) => b.score - a.score);
}

function identify(group, { mmPerPx = null, imprint = "", limit = 8 } = {}) {
  const lenMm = groupLengthMm(group, mmPerPx);

// Native bridge: lets the web app get camera + LiDAR frames from the iPhone app shell (ios/).
// In a normal browser nbAvailable() is false and nothing here does anything.
//
// FRAME CONTRACT (the object handed to onFrame and resolved by nbCapture):
//   {
//     rgba:   Uint8ClampedArray, width*height*4, RGBA, opaque. SENSOR orientation (landscape, NOT rotated
//             to the phone's orientation). Long side ~720 px for the live stream, ~1920 px for nbCapture.
//     width, height,
//     intrinsics: { fx, fy, cx, cy }   pixels of the rgba image (already scaled to width x height),
//     depth:  null when the phone has no LiDAR, otherwise EXACTLY the engine's opts.depth shape:
//             { data: Float32Array (w*h, METERS, 0 = no reading), w, h,   (256x192 on current iPhones)
//               conf: Uint8Array (w*h; 0 low, 1 medium, 2 high) or null,
//               fx, fy, cx, cy }        same intrinsics as above, in RGBA-image pixel units
//   }
//   Depth has the same orientation and field of view as rgba, just lower resolution.
// Frames are pushed only after the previous one was delivered (so the page never gets a backlog).
//
// Swift side talks to this file through window.__native.* (set below) and receives commands through
// window.webkit.messageHandlers.native.postMessage({cmd: "start" | "ack" | "stop" | "torch" | "capture", ...}).
// Frame bytes are fetched from the app's own custom URL scheme: /__frame/<key>.bin

  PCX.verify = null; PCX.hit = false;
  S.busy = true; app.classList.add("busy");
  try { if (S.inflight) await S.inflight.catch(() => {}); } catch {}
