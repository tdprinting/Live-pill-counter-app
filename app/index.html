<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pill Counter">
<meta name="theme-color" content="#06090c">
<meta name="color-scheme" content="dark">
<title>Pill Counter</title>
<style>
/* ============ tokens ============ */
:root{
  --accent:#19d3c5; --accent-2:#5fe3d8; --accent-ink:#021a18;
  --alert:#ff5a6a; --alert-bg:#d92d43; --amber:#ffb42e;
  --bg:#06090c;
  --panel:rgba(12,14,18,.78); --glass:rgba(12,14,18,.66); --glass-strong:rgba(14,17,22,.95);
  --line:rgba(255,255,255,.16); --text:#f4f7f9; --muted:rgba(244,247,249,.74);
  --chip:rgba(255,255,255,.11); --track:rgba(255,255,255,.2);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:16px/1.35 var(--font);-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){ html{font:-apple-system-body;line-height:1.35} }
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font:inherit;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;background:#000}
#video,#still,#demo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#still.contain{object-fit:contain}
#app[data-src="video"] #video,#app[data-src="demo"] #demo{display:block}
#app.frozen #still{display:block}
#app.frozen #video,#app.frozen #demo{display:none}
#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none;pointer-events:none}
#app.frozen #overlay,#app.roi-edit #overlay{pointer-events:auto}
#scan{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s;overflow:hidden}
#scan::after{content:"";position:absolute;left:0;right:0;height:22%;top:-22%;
  background:linear-gradient(to bottom,transparent,rgba(25,211,197,.22),transparent);animation:scan 1.3s linear infinite}
#app.busy #scan{opacity:1}
@keyframes scan{to{top:100%}}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:.5px solid var(--line)}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:.5px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35)}

/* ============ top bar: mode switch left, menu right ============ */
#top{position:absolute;z-index:10;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);top:calc(var(--sat) + 8px);
  display:flex;align-items:center;gap:8px;pointer-events:none;max-width:600px;margin:0 auto}
#top>*{pointer-events:auto}
.sp{flex:1;pointer-events:none!important}
.seg{display:flex;padding:3px;border-radius:22px;position:relative}
.seg .thumb{display:none}
.seg button{position:relative;min-height:44px;min-width:44px;padding:0 16px;border-radius:19px;font-weight:600;font-size:1rem;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ib{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;transition:transform .15s,background .2s;flex:none}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

#guide{position:absolute;z-index:12;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 62px);border-radius:24px;padding:6px 6px 6px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;font-weight:600;font-size:1rem;width:max-content;max-width:94vw}
#guide button{min-height:44px;padding:0 14px;border-radius:22px;background:var(--chip);color:var(--accent);font-weight:600}

/* ============ bottom dock: alert pill + the one main panel ============ */
#dock{position:absolute;z-index:11;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 8px);margin:0 auto;max-width:560px;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;transition:opacity .25s,transform .3s}
#dock>*{pointer-events:auto}
#app.roi-edit #dock{opacity:0;transform:translateY(30px);pointer-events:none}
#app.roi-edit #dock>*{pointer-events:none}

#alertWrap{display:flex;flex-direction:column;align-items:center;gap:8px}
#alertList{width:100%;border-radius:22px;padding:6px;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid var(--line);animation:slidein .25s}
.arow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 10px;border-radius:16px}
.arow+.arow{border-top:.5px solid var(--line)}
.arow .aic{flex:none}
.arow .at{flex:1;min-width:0;font-weight:600;font-size:1rem}
.arow .at small{display:block;font-weight:500;color:var(--muted);font-size:.95rem}
.aic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem;background:var(--chip);color:var(--text)}
.aic.odd{background:var(--alert-bg);color:#fff}.aic.frag{background:var(--amber);color:#2a1700}
.aic.hid{background:transparent;color:var(--text);border:2px dashed rgba(255,255,255,.8)}
.aic.warn{background:var(--chip);color:var(--amber)}
.alertpill{display:flex;align-items:center;min-height:48px;max-width:100%;border-radius:24px;background:var(--panel);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid var(--line);
  box-shadow:0 6px 20px rgba(0,0,0,.35);animation:slidein .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slidein{from{opacity:0;transform:translateY(8px) scale(.97)}}
.alertpill[data-k="odd"]{background:var(--alert-bg);border-color:rgba(255,255,255,.3);color:#fff}
.alertpill[data-k="odd"] .aic{background:#fff;color:var(--alert-bg)}
.alertpill[data-k="frag"]{background:var(--amber);color:#2a1700;border-color:transparent}
.alertpill[data-k="frag"] .aic{background:#2a1700;color:var(--amber)}
#alertMain{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px 0 9px;min-width:0;font-weight:600;font-size:1rem;text-align:left}
#alertTxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#alertMore{flex:none;white-space:nowrap;opacity:.85}
#alertMain svg{flex:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.8;transition:transform .2s}
#alertMain[aria-expanded="true"] svg{transform:rotate(180deg)}
.aact{flex:none;min-height:36px;margin:0 6px 0 -4px;padding:0 14px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.95rem}
.arow .aact{margin:0}

#hud{border-radius:28px;padding:10px 16px 12px;text-align:center;transition:box-shadow .3s,border-color .3s,transform .3s}
#hud.locked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 30px rgba(25,211,197,.22)}
.p-count{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px}
.roll{font-size:96px;line-height:1;font-weight:700;letter-spacing:-.02em;display:flex;height:1em;overflow:hidden;font-variant-numeric:tabular-nums;min-width:.62em}
.dg{display:block;width:.6em;height:1em;overflow:hidden}
.strip{display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.9,.2,1)}
.strip span{display:block;height:1em;line-height:1;text-align:center}
#hud.locked .roll,#hud.pop .roll{animation:lockpulse .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes lockpulse{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}
#goalOf{font-size:1.6rem;font-weight:600;color:var(--muted);padding-bottom:.55rem;white-space:nowrap}
.p-state{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px 10px;min-height:1.7rem}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem}
.state i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.state.hold{color:var(--amber)} .state.hold i{background:var(--amber);animation:blink 1s infinite}
.state.lock{color:var(--accent)} .state.lock i{background:var(--accent)}
.state.cap i{background:var(--text)}
@keyframes blink{50%{opacity:.25}}
.goal{font-weight:700;font-size:1.15rem;white-space:nowrap}
.goal.add{color:var(--amber)}.goal.rem{color:var(--alert)}.goal.ok{color:var(--accent)}
.goal::before{content:"\00b7";margin-right:10px;color:var(--muted)}
.conf{display:flex;align-items:center;justify-content:center;gap:12px;max-width:380px;margin:8px auto 0}
.bar{height:6px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.conf .bar{flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--c,var(--accent));transition:width .6s cubic-bezier(.2,.9,.2,1),background .4s}
#confLabel{flex:none;font-weight:600;font-size:1rem;min-width:7.2em;text-align:left;font-variant-numeric:tabular-nums}

#meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;margin-top:6px;font-size:.95rem;color:var(--muted)}
#sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pcbBadge{font-weight:600}
#nbaChip{font-size:.85rem;font-weight:700;letter-spacing:.04em;padding:1px 9px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.corr{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.corr button{min-height:36px;padding:0 12px;border-radius:18px;background:var(--chip);color:var(--accent)}
.verify{font-weight:700;padding:2px 10px;border-radius:12px}
.verify.ok{background:rgba(25,211,197,.2);color:var(--accent)}.verify.diff{background:rgba(255,180,46,.22);color:var(--amber)}
#hint{flex-basis:100%;text-align:center;font-size:.95rem;color:var(--muted)}

#actions>*{min-width:0}
#actions{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"q m t" "i i i";align-items:center;gap:0 8px;margin-top:8px}
#chipQty{grid-area:q;justify-self:start}
#mainBtns{grid-area:m;display:flex;gap:8px;justify-content:center}
#chipAdd{grid-area:t;justify-self:end}
#idLine{grid-area:i;justify-self:center}
.tbtn{min-height:48px;padding:0 14px;border-radius:24px;font-weight:600;font-size:1.05rem;color:var(--accent);white-space:nowrap}
.tbtn b{color:var(--text);font-weight:700}
.tbtn:active{background:var(--chip)}
#shutter{position:relative;width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;background:rgba(0,0,0,.18);transition:transform .15s;flex:none}
#shutter::after{content:"";width:54px;height:54px;border-radius:50%;background:#fff;transition:transform .15s}
#shutter:active{transform:scale(.94)} #shutter:active::after{transform:scale(.88)}
#autoRing{position:absolute;left:-8px;top:-8px;width:80px;height:80px;transform:rotate(-90deg);pointer-events:none;display:none}
#autoRing circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3}
.sbtn{flex:1;min-height:52px;padding:0 8px;border-radius:26px;font-weight:700;font-size:1.05rem;background:var(--chip);white-space:nowrap}
#retake{flex:1.3;min-height:52px;border-radius:26px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
#idLine{display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px;max-width:100%;padding:0 10px;font-size:1.02rem;font-weight:600;color:var(--text)}
#idLineTxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#idLine svg{flex:none;width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#tallyLine{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;font-weight:700;font-size:.95rem;max-width:100%;white-space:nowrap;background:var(--chip)}
.pchip b{color:var(--accent)}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pchip.tally{min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;line-height:44px;flex:0 1 auto}
.pchip.sq{padding:0;width:44px;justify-content:center}
#hud.hit{animation:hit .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(25,211,197,.7)}40%{transform:scale(1.015);box-shadow:0 0 0 12px rgba(25,211,197,0),0 8px 40px rgba(25,211,197,.5)}100%{transform:scale(1)}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent);animation:fly .85s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* captured state: Retake / Recount / Save, then Qty / Tally */
#app.frozen #actions{grid-template-columns:1fr 1fr;grid-template-areas:"m m" "q t" "i i";gap:6px 8px}
#app.frozen #mainBtns{justify-self:stretch;min-width:0}
#app.frozen #mainBtns>*{min-width:0}
@media (max-height:740px){
  .roll{font-size:80px}
  #hud{padding:6px 14px 8px;border-radius:24px}
  .conf{margin-top:4px}
  #meta{margin-top:2px;gap:0 12px}
  .p-state{min-height:1.45rem}
  #actions{margin-top:4px}
  #idLine{min-height:40px}
  .tbtn{min-height:44px}
  #shutter{width:64px;height:64px}#shutter::after{width:46px;height:46px}#autoRing{width:72px;height:72px;left:-8px;top:-8px}
  #app.frozen #actions{grid-template-columns:auto 1fr auto;grid-template-areas:"m m m" "q i t"}
}

/* ============ identification sheet (count mode) ============ */
#sheetScrim{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
body.sheet-open #sheetScrim{opacity:1;pointer-events:auto}
#sheet{position:absolute;z-index:20;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;height:min(84vh,84dvh,780px);border-radius:28px 28px 0 0;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
  border:.5px solid var(--line);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.4);
  display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.2,1),visibility 0s .4s;will-change:transform}
body.sheet-open #sheet{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.9,.2,1),visibility 0s}
#sheet.drag{transition:none}
#sheetHead{flex:none;padding:8px 12px 6px 16px;touch-action:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 6px}
.peek{display:flex;align-items:center;gap:12px;min-height:56px}
.peek canvas{flex:none}
.peek .pt{flex:1;min-width:0}
.peek .pt b{display:block;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .pt span{display:block;font-size:.95rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetBody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sab) + 28px);touch-action:pan-y;-webkit-user-select:text;user-select:text}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;background:var(--chip);font-size:.95rem;font-weight:600}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.chip.link{color:var(--accent);min-height:44px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,180,46,.14);border:.5px solid rgba(255,180,46,.45);font-size:.95rem;font-weight:500;margin-bottom:14px}
.notice b{color:var(--amber)}
.field{display:flex;align-items:center;gap:8px;height:52px;border-radius:16px;background:var(--chip);padding:0 14px;margin-bottom:6px}
.field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:1.1rem;font-family:var(--mono);text-transform:uppercase;-webkit-user-select:text;user-select:text}
.field input::placeholder{text-transform:none;font-family:var(--font);color:var(--muted)}
.field svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.field button{width:44px;height:44px;margin-right:-10px;color:var(--muted);font-size:1.1rem}
h3.sec{margin:18px 0 8px;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{display:flex;gap:14px;padding:14px;border-radius:20px;background:var(--chip);margin-bottom:10px;position:relative;animation:slidein .3s both}
.card.best{background:linear-gradient(135deg,rgba(25,211,197,.2),rgba(25,211,197,.06));border:.5px solid rgba(25,211,197,.55)}
.card canvas{flex:none;margin-top:2px}
.card .ci{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:1.25rem;line-height:1.2}
.card .nm small{font-weight:600;color:var(--accent);font-size:1.1rem}
.card .im{font-family:var(--mono);font-size:1rem;margin-top:3px;color:var(--text)}
.card .meta{font-size:.95rem;color:var(--muted);margin-top:2px}
.card .why{font-size:.95rem;color:var(--muted);margin-top:4px}
.score{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.95rem;font-weight:700}
.score .bar{flex:1;height:8px;border-radius:4px}
.lockbtn{margin-top:10px;min-height:48px;padding:0 18px;border-radius:24px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem}
.lockbtn.on{background:var(--chip);color:var(--text)}
.lockbtn.ghost{background:var(--chip);color:var(--accent)}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:1.02rem}
.tag{display:inline-block;font-size:.9rem;font-weight:600;padding:3px 10px;border-radius:10px;background:var(--chip);color:var(--muted);margin:6px 4px 0 0}
.card .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.card .btns .lockbtn,.card .btns a{margin-top:4px;display:inline-grid;place-items:center;text-decoration:none}
.card.chosen{outline:2px solid var(--accent)}
details.sim{margin-top:4px}
details.sim summary{min-height:48px;display:flex;align-items:center;color:var(--accent);font-weight:600;font-size:1rem;cursor:pointer;list-style:none}
details.sim summary::-webkit-details-marker{display:none}
details.sim summary::after{content:"\203A";margin-left:6px;font-size:1.3rem;line-height:1;transition:transform .2s}
details.sim[open] summary::after{transform:rotate(90deg)}
.simrow{padding:8px 0;border-top:.5px solid var(--line);font-size:1rem}
.simrow b{display:block}.simrow span{color:var(--muted);font-size:.95rem}

/* ============ modal bottom sheet (menu, settings, history, qty, tally, record...) ============ */
#modalWrap{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
#modal{width:100%;max-width:560px;max-height:88dvh;max-height:88vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--glass-strong);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:.5px solid var(--line);border-bottom:0;animation:rise .4s cubic-bezier(.2,.9,.2,1);touch-action:pan-y}
#modal.drag{animation:none;transition:none}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
#modalGrab{flex:none;height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}
#modalGrab .grab{margin:0}
#modalBody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 18px calc(var(--sab) + 20px);-webkit-user-select:text;user-select:text}
#modal h2{margin:0 0 6px;font-size:1.5rem}
#modal p{margin:0 0 14px;color:var(--muted);font-size:1rem}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 16px;border-radius:16px;background:var(--chip);margin-bottom:8px;text-align:left;font-weight:600;font-size:1.05rem}
.opt small{margin-left:auto;color:var(--muted);font-weight:500;font-size:.95rem}
.opt.sel{outline:2px solid var(--accent)}
.opt .lbl{display:block}.opt .lbl small{display:block;margin:0;font-size:.95rem}
.sw2{margin-left:auto;width:52px;height:32px;border-radius:16px;background:var(--track);position:relative;flex:none;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.opt[aria-checked="true"] .sw2{background:var(--accent)}.opt[aria-checked="true"] .sw2::after{transform:translateX(20px)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:52px;border-radius:26px;font-weight:700;font-size:1.05rem;background:var(--chip);display:grid;place-items:center;text-align:center;padding:0 12px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:var(--accent-ink)}
/* menu rows */
.srow{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 6px;border-bottom:.5px solid var(--line);text-align:left;font-size:1.1rem;font-weight:600}
.srow:last-child{border-bottom:0}
.srow:active{background:var(--chip)}
.srow .si{flex:none;width:36px;height:36px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--accent)}
.srow .si svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srow .sl{flex:1;min-width:0}
.srow .sv{color:var(--muted);font-weight:500;font-size:1rem}
.srow .chev2{flex:none;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.srow[role="switch"] .sw2{margin-left:0}
.srow[role="switch"][aria-checked="true"] .sw2{background:var(--accent)}.srow[role="switch"][aria-checked="true"] .sw2::after{transform:translateX(20px)}
.srow.segrow{cursor:default}
.srow.segrow:active{background:none}
.srow .seg{background:var(--chip)}
.padv{font-size:3.2rem;font-weight:700;text-align:center;min-height:1.2em;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.presets button{flex:1 0 20%;min-height:52px;border-radius:26px;background:var(--chip);font-weight:700;font-size:1.1rem}
.presets button.on{background:var(--accent);color:var(--accent-ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:58px;border-radius:18px;background:var(--chip);font-size:1.5rem;font-weight:600}
.pad button:active{background:var(--accent);color:var(--accent-ink)}
.recimg{width:100%;max-height:52dvh;object-fit:contain;background:#000;border-radius:16px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;margin-bottom:10px}
.batch{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:.5px solid var(--line);font-variant-numeric:tabular-nums;font-size:1.05rem}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line)}
.hist b{font-size:2rem;min-width:56px;font-variant-numeric:tabular-nums}
.hist span{color:var(--muted);font-size:.95rem}
.hist .r{margin-left:auto;text-align:right}
.hist .thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}

/* ============ onboarding ============ */
#onb{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px);animation:fade .3s}
.onbcard{width:100%;max-width:380px;border-radius:28px;background:var(--glass-strong);border:.5px solid var(--line);padding:26px 22px 20px;text-align:center}
.onbart{width:96px;height:96px;margin:0 auto 12px;border-radius:28px;background:var(--chip);display:grid;place-items:center;color:var(--accent);font-size:3rem;font-weight:700}
.onbart svg{width:56px;height:56px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.onbstep{font-size:.95rem;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.onbcard h2{margin:6px 0 8px;font-size:1.6rem;line-height:1.2}
.onbcard p{margin:0 0 16px;color:var(--muted);font-size:1.05rem;min-height:2.7em}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--accent)}

/* ============ toast / fallback ============ */
#toast{position:absolute;z-index:45;left:50%;top:calc(var(--sat) + 64px);transform:translate(-50%,-140px);padding:12px 18px;border-radius:24px;font-weight:600;font-size:1rem;width:max-content;max-width:90vw;text-align:center;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#fallback{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0,#10303a 0,#06090c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--sat) + 24px) 28px calc(var(--sab) + 24px);gap:14px;color:#f4f7f9}
#fallback h1{margin:6px 0 0;font-size:1.7rem}
#fallback p{margin:0;max-width:340px;color:rgba(244,247,249,.78);font-size:1.05rem}
#fallback .big{min-height:56px;min-width:240px;padding:0 28px;border-radius:28px;background:var(--accent);color:#021a18;font-weight:700;font-size:1.15rem;display:grid;place-items:center;margin-top:8px;cursor:pointer}
#fallback .sec2{min-height:48px;color:var(--accent-2);font-weight:600;display:grid;place-items:center;padding:0 16px;cursor:pointer;font-size:1.05rem}
#fallback .why{font-size:.9rem;font-family:var(--mono);opacity:.6}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.pillart{width:92px;height:92px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}

/* ============ identify mode ============ */
#app.idm :is(#dock,#sheet,#sheetScrim,#guide){display:none!important}
#idv{position:absolute;inset:0;z-index:8;pointer-events:none}
#idv>*{pointer-events:auto}
#idPrompt{position:absolute;left:50%;transform:translateX(-50%);width:max-content;padding:9px 18px;border-radius:22px;font-weight:600;font-size:1.02rem;max-width:92vw;text-align:center;pointer-events:none}
#idPanel{position:absolute;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 8px);margin:0 auto;max-width:560px;border-radius:28px;padding:14px 16px 14px;transition:border-color .3s,box-shadow .3s}
#idPanel.got{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 30px rgba(25,211,197,.25);animation:lockpulse .5s cubic-bezier(.2,.9,.3,1.3)}
.idrow{display:flex;align-items:center;gap:14px}
.idicon{flex:none;animation:float 3s ease-in-out infinite}
.idinfo{flex:1;min-width:0}
.idtraits{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;min-height:30px;font-size:1.1rem;font-weight:600}
.idtraits .sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.4);vertical-align:-2px;margin-right:4px}
.idtraits .linkbtn{min-height:44px;color:var(--accent);font-weight:600;font-size:1rem}
.idstate{display:flex;flex-direction:column;gap:8px;margin-top:6px;font-weight:700}
.idstate span{font-size:1.5rem;line-height:1.15}
.idstate .bar{height:6px}
.idstate.ok span{color:var(--accent)}.idstate.hold span{color:var(--amber)}
#idPicks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#idPicks:empty{display:none}
#idPicks .pchip{min-height:44px;padding:0 12px 0 8px}
#idPanel .row{margin-top:12px}
/* imprint step: full screen, big zoom, one tool row, big field; results slide up as a sheet */
#idRes{position:absolute;inset:0;display:flex;flex-direction:column;background:#07090c;animation:fade .25s;padding:calc(var(--sat) + 62px) 0 0;-webkit-user-select:text;user-select:text}
#idTop{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 max(14px,var(--sar)) 10px max(14px,var(--sal));max-width:600px;width:100%;margin:0 auto}
#idRes.big #idTop{display:none}
.idhd{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.idhd b{font-size:1.2rem}
.idhd .tbtn{min-height:44px;padding:0 6px}
.zwrap{position:relative}
#idZoom{width:100%;height:clamp(150px,30vh,320px);border-radius:20px;background:#000;touch-action:none;display:block;-webkit-user-select:none;user-select:none}
.zfab{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.zfab button{width:44px;height:44px;border-radius:22px;background:rgba(12,14,18,.7);font-size:1.2rem;display:grid;place-items:center}
.idtools{display:flex;gap:8px;margin:10px 0 4px}
.idtools .pchip{flex:1;justify-content:center;min-height:48px;border-radius:24px;font-size:1rem}
.idsides{display:flex;gap:6px;margin-bottom:8px}
.idsides .pchip{flex:1;justify-content:center}
.idsides .pchip[aria-pressed="false"],.idtools .pchip[aria-pressed="false"]{background:var(--chip);color:var(--text)}
.idlbl{display:block;font-size:.95rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
.idinp{width:100%;height:64px;border-radius:18px;background:var(--chip);border:2px solid transparent;font:600 1.9rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:0 16px;outline:0;-webkit-user-select:text;user-select:text}
.idinp:focus{border-color:var(--accent)}
.idinp::placeholder{font:500 1.05rem var(--font);text-transform:none;letter-spacing:0;color:var(--muted)}
details.qk{margin-top:4px}
details.qk summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;cursor:pointer;list-style:none}
details.qk summary::-webkit-details-marker{display:none}
.keys{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.keys button{min-width:44px;min-height:44px;padding:0 10px;border-radius:14px;background:var(--chip);font:700 1.1rem var(--mono)}
.keys button:active{background:var(--accent);color:var(--accent-ink)}
#idSheet{flex:1 1 220px;min-height:190px;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--glass-strong);border:.5px solid var(--line);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.5);
  width:100%;max-width:640px;margin:0 auto;animation:sheetup .45s cubic-bezier(.2,.9,.2,1)}
@keyframes sheetup{from{transform:translateY(60%);opacity:0}}
.grabbtn{flex:none;min-height:34px;width:100%;display:grid;place-items:center;touch-action:none;cursor:pointer}
.grabbtn .grab{margin:0}
#idSum{flex:none;padding:0 18px 8px;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:10px;min-height:36px}
#idSum small{display:block;font-weight:500;color:var(--muted);font-size:.95rem}
#idSumTxt{min-width:0}
#idList{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--sab) + 24px);touch-action:pan-y}
.idcap{font-size:.95rem;color:var(--muted);margin:2px 0 8px}
.idfine{font-size:.95rem;color:var(--muted);margin:14px 0 4px;text-align:center}

@media (orientation:landscape) and (max-height:520px){
  #dock{left:auto;right:calc(var(--sar) + 10px);width:min(400px,50vw)}
  #idPanel{left:auto;width:min(400px,50vw)}
  .roll{font-size:64px}
  #top{max-width:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  #scan::after{animation:none;top:0;height:100%;background:rgba(25,211,197,.10)}
}
</style>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div id="app" data-src="">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="still"></canvas>
  <canvas id="demo"></canvas>
  <canvas id="overlay"></canvas>
  <div id="scan"></div>

  <!-- top bar: mode switch (left), light + menu (right) -->
  <header id="top">
    <div class="seg glass" id="appSeg" role="group" aria-label="App mode">
      <span class="thumb"></span>
      <button data-app="count" aria-pressed="true">Count</button>
      <button data-app="identify" aria-pressed="false">Identify</button>
    </div>
    <span class="sp"></span>
    <button class="ib glass" id="btnTorch" aria-label="Light" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6h-4zM10 9l-1 12h6l-1-12"/></svg></button>
    <button class="ib glass" id="btnMenu" aria-label="Menu" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <!-- controls that now live in the menu sheet; kept as the handlers the menu rows trigger -->
  <div id="legacy" hidden>
    <div class="seg" id="modeSeg" role="group" aria-label="Counting mode">
      <span class="thumb"></span>
      <button data-mode="tray" aria-pressed="true">Tray</button>
      <button data-mode="free" aria-pressed="false">Anywhere</button>
    </div>
    <button id="btnArea" aria-pressed="false">Set area</button>
    <button id="btnCal">Calibrate size</button>
    <button id="btnHist">History</button>
    <button id="btnSet">Settings</button>
    <button id="chipG5" aria-pressed="false">5s</button>
  </div>

  <div id="guide" class="glass" hidden><span id="guideTxt"></span><button id="guideCancel">Cancel</button></div>

  <!-- bottom dock: one alert pill + the one main panel -->
  <div id="dock">
    <div id="alertWrap" hidden>
      <div id="alertList" hidden></div>
      <div id="alert" class="alertpill" data-k="warn" aria-live="polite">
        <button id="alertMain" aria-expanded="false" aria-controls="alertList"><span class="aic" id="alertIc">!</span><span id="alertTxt"></span><span id="alertMore"></span><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <span id="alertActSlot"></span>
      </div>
    </div>

    <section id="hud" class="panel" aria-label="Count">
      <div class="p-count">
        <div id="count" class="roll" role="img" aria-label="0"></div>
        <div id="goalOf" hidden></div>
        <span class="burst" id="burst"></span>
      </div>
      <div class="p-state">
        <div id="state" class="state" aria-live="polite"><i></i><span>Starting…</span></div>
        <div id="goal" class="goal" hidden></div>
      </div>
      <div class="conf">
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Confidence" id="confBar"><i id="confFill"></i></div>
        <span id="confLabel">—</span>
      </div>
      <div id="meta">
        <span id="sub"></span>
        <span id="pcbBadge" hidden></span>
        <span id="nbaChip" hidden>LiDAR</span>
        <span id="corr" class="corr" hidden><span id="corrTxt"></span><button id="corrReset">Reset</button></span>
        <span id="verify" class="verify" hidden></span>
        <div id="hint" hidden></div>
      </div>
      <div id="tallyLine">
        <button class="pchip tally" id="chipTally" hidden></button>
        <button class="pchip sq" id="chipUndo" aria-label="Undo last batch" hidden>↶</button>
      </div>
      <div id="actions">
        <button class="tbtn" id="chipQty" aria-label="Set target quantity">Qty <b id="chipQtyV">set</b></button>
        <div id="mainBtns">
          <button id="shutter" aria-label="Capture"><svg id="autoRing" viewBox="0 0 84 84" aria-hidden="true"><circle id="autoRingC" cx="42" cy="42" r="40"/></svg></button>
          <button id="retake" hidden>Retake</button>
          <button id="btnRecount" class="sbtn" hidden>Recount</button>
          <button id="btnSave" class="sbtn" hidden>Save record</button>
        </div>
        <button class="tbtn" id="chipAdd" aria-label="Add this count to tally">Tally +</button>
        <button id="idLine" hidden aria-label="Open identification"><span id="idLineTxt"></span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </section>
  </div>

  <div id="sheetScrim"></div>
  <aside id="sheet" aria-label="Identification" aria-hidden="true">
    <header id="sheetHead">
      <div class="grab"></div>
      <div class="peek">
        <canvas id="peekIcon" width="48" height="48" style="width:48px;height:48px"></canvas>
        <div class="pt"><b id="peekTitle">Identify</b><span id="peekSub">Count pills to see matches</span></div>
        <button class="ib" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>
    <div id="sheetBody"></div>
  </aside>

  <section id="idv" hidden aria-label="Identify a pill">
    <div id="idPrompt" class="glass">Place one pill in the circle</div>
    <div id="idPanel" class="panel" aria-live="polite">
      <div class="idrow">
        <canvas id="idIcon" class="idicon" width="64" height="64" style="width:64px;height:64px" aria-hidden="true"></canvas>
        <div class="idinfo">
          <div class="idtraits" id="idTraits"></div>
          <div class="idstate" id="idState"><span id="idStateTxt">Looking for a pill…</span><div class="bar"><i id="idSteady"></i></div></div>
        </div>
      </div>
      <div id="idPicks"></div>
      <div class="row"><button class="btn" id="idCapNow">Capture now</button><button class="btn" id="idCancelFlip" hidden>Cancel</button></div>
    </div>
    <div id="idRes" hidden></div>
  </section>

  <div id="modalWrap" hidden><div id="modal" role="dialog" aria-modal="true"><div id="modalGrab" aria-hidden="true"><div class="grab"></div></div><div id="modalBody"></div></div></div>

  <div id="onb" hidden role="dialog" aria-modal="true" aria-label="How to count pills">
    <div class="onbcard">
      <div class="onbart" id="onbArt" aria-hidden="true"></div>
      <div class="onbstep" id="onbStep"></div>
      <h2 id="onbTitle"></h2>
      <p id="onbText"></p>
      <div class="dots" id="onbDots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="row"><button class="btn" id="onbSkip">Skip</button><button class="btn pri" id="onbNext">Next</button></div>
    </div>
  </div>

  <div id="toast" class="glass" role="status"></div>

  <section id="fallback" hidden>
    <svg class="pillart" viewBox="0 0 96 96"><g transform="rotate(-35 48 48)"><rect x="12" y="30" width="72" height="36" rx="18" fill="#19d3c5"/><path d="M48 30h18a18 18 0 0 1 0 36H48z" fill="#f4f7f9"/></g></svg>
    <h1 id="fbTitle">Camera unavailable</h1>
    <p id="fbMsg">Take a photo of your tray and we will count it the same way.</p>
    <label class="big">Take photo<input class="vh" id="fileCam" type="file" accept="image/*" capture="environment"></label>
    <label class="sec2">Choose from library<input class="vh" id="fileLib" type="file" accept="image/*"></label>
    <button class="sec2" id="fbRetry">Try camera again</button>
    <div class="why" id="fbWhy"></div>
  </section>
</div>

<!-- APP_SCRIPT -->
<script type="module" src="app.js"></script>
<script>
  // Offline support: the service worker keeps a copy so the app opens with no signal.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
